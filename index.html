  },
  newRoleChange(){ const w = $('#slWrap'); if(w) w.classList.toggle('hidden', $('#sr').value !== 'sales'); },
  async setRole(uid, role){
    const u = S.users[uid]; if(!u || u.role === role) return;
    if(role === 'manager' && !isOwner()) return toast('الأدمن بس اللي يعيّن مدير مبيعات');
    try{
      await store.updateUser(uid, {role, leaderId:null});
      if(u.role === 'leader'){ // فريقه بيبقى من غير تيم ليدر
        for(const m of Object.values(S.users).filter(x => x.leaderId === uid)) await store.updateUser(m.uid, {leaderId:null});
        const ids = S.leads.filter(l => l.teamId === uid && l.assignedTo !== uid).map(l => l.id);
        if(ids.length) await store.updateLeads(ids, {teamId:null});
      }
      const own = S.leads.filter(l => l.assignedTo === uid).map(l => l.id);
      if(own.length) await store.updateLeads(own, {teamId: role === 'leader' ? uid : null});
      await store.addActivity({type:'assign', at:Date.now(), by:S.me.uid, byName:S.me.name, note:`${S.me.name} خلّى ${u.name} ${ROLE_LABEL[role]}`});
      toast(`${u.name} بقى ${ROLE_LABEL[role]} ✓`);
    }catch(e){ toast(fbError(e)); render(); }
  },
  async setLeader(uid, leaderId){
    const u = S.users[uid]; leaderId = leaderId || null;
    try{
      await store.updateUser(uid, {leaderId});
      const own = S.leads.filter(l => l.assignedTo === uid).map(l => l.id);
      if(own.length) await store.updateLeads(own, {teamId:leaderId});
      toast(leaderId ? `${u.name} بقى في فريق ${userName(leaderId)} ✓` : `${u.name} بقى من غير تيم ليدر`);
    }catch(e){ toast(fbError(e)); render(); }
  },
  copyCred(){
    const c = S.newCred; const txt = `أهلاً ${c.name}، دي بيانات دخولك على Blue:\nاسم الدخول: ${c.login}\nكلمة السر: ${c.pw}\nاللينك: ${location.href.split('#')[0]}`;
    navigator.clipboard.writeText(txt).then(() => toast('اتنسخت ✓'), () => toast('مقدرتش أنسخ، انسخها بإيدك'));
  },
  pwSheet(uid){
    const u = S.users[uid]; if(!u) return;
    openSheet(`<div class="sheet-h"><h2>كلمة سر جديدة</h2><button class="x" onclick="App.close()">×</button></div>
      <p class="muted">لـ <b>${esc(u.name)}</b> — اسم الدخول هيفضل زي ما هو: <code dir="ltr">${esc(u.login)}</code><br>كلمة السر القديمة هتبطّل تشتغل، وكل عملاؤه وتاريخهم هيفضلوا معاه.</p>
      <div class="card"><label class="f">كلمة السر الجديدة</label>
        <input class="in" id="npw" dir="ltr" minlength="6" placeholder="6 حروف أو أرقام على الأقل">
        <button class="btn block" style="margin-top:12px" id="npwBtn" onclick="App.resetPw('${uid}')">غيّر كلمة السر</button></div>`);
    setTimeout(() => { const el = $('#npw'); if(el) el.focus(); }, 50);
  },
  async resetPw(uid){
    const u = S.users[uid], pw = $('#npw').value.trim();
    if(pw.length < 6) return toast('كلمة السر لازم 6 حروف أو أرقام على الأقل');
    const b = $('#npwBtn'); b.disabled = true; b.textContent = 'بيغيّر...';
    try{
      await store.resetSales(u, pw);
      closeSheet(); S.newCred = {name:u.name, login:u.login, pw, reset:true};
      await store.addActivity({type:'assign', at:Date.now(), by:S.me.uid, byName:S.me.name, note:`${S.me.name} غيّر كلمة سر ${u.name}`});
      render(); window.scrollTo(0, 0); toast('اتغيرت ✓');
    }catch(e){ toast(fbError(e)); b.disabled = false; b.textContent = 'غيّر كلمة السر'; }
  },
  async toggleUser(uid, on){ try{ await store.updateUser(uid, {active:on}); toast(on ? 'الحساب اتفعّل' : 'الحساب اتقفل'); }catch(e){ toast(fbError(e)); render(); } }
};

/* ---------------- أفعال: بيانات العميل، العمولة، الوحدات، الصور ---------------- */
Object.assign(App, {
  imo(phone){
    const p = normalizePhone(phone), intl = p.startsWith('+') ? p : '+' + intlDigits(p);
    const done = () => toast('الرقم اتنسخ — افتح imo والصقه في البحث');
    try{ navigator.clipboard.writeText(intl).then(done, () => toast('رقم imo: ' + intl)); }catch(e){ toast('رقم imo: ' + intl); }
  },
  ctChange(){ const v = $('#lCt').value; const w = $('#lFurnWrap'); if(w) w.classList.toggle('hidden', !['owner_rent', 'tenant'].includes(v)); },
  async saveInfo(){
    const l = leadById(S.openId); if(!l) return;
    const patch = {clientType:$('#lCt').value || null, source:$('#lSrc').value || null, furnished:$('#lFurn') ? ($('#lFurn').value || null) : null};
    try{ await store.updateLeads([l.id], patch, null); toast('اتحفظت بيانات العميل ✓'); const nl = leadById(l.id); if(nl) openSheet(leadSheet({...nl, ...patch})); }
    catch(e){ toast(fbError(e)); }
  },
  dealCalc(){
    const t = $('#dType').value; $('#dValLbl').textContent = dealValLabel(t);
    const l = leadById(S.openId) || {};
    $('#dCalc').innerHTML = commText({...l, dealType:t, dealValue:$('#dVal').value, clientType:($('#lCt') && $('#lCt').value) || l.clientType});
  },
  async saveDeal(){
    const l = leadById(S.openId); if(!l) return;
    const dealType = $('#dType').value || null, dealValue = digitsOnly($('#dVal').value) || null, agreed = $('#dAgreed').checked;
    const c = calcCommission({...l, dealType, dealValue, clientType:($('#lCt') && $('#lCt').value) || l.clientType});
    const patch = {dealType, dealValue, commissionAgreed:agreed, commission:c ? Math.round(c.amount) : null};
    try{
      await store.updateLeads([l.id], patch, agreed && !l.commissionAgreed ? {at:Date.now(), by:S.me.uid, byName:S.me.name, status:'assign', note:'العميل اتفق على العمولة' + (c ? ' — ' + money(c.amount) : '')} : null);
      toast('اتحفظت العمولة ✓');
    }catch(e){ toast(fbError(e)); }
  },
  newLead(){ recCleanup(); openSheet(newLeadSheet()); setTimeout(() => { const e = $('#nlName'); if(e) e.focus(); }, 60); },
  async saveNewLead(e){
    e.preventDefault();
    const phone = normalizePhone($('#nlPhone').value);
    if(phone.replace('+', '').length < 7) return toast('رقم التليفون مش مظبوط');
    const dupL = S.leads.find(l => l.phone === phone);
    if(dupL) return toast(`الرقم ده موجود قبل كده${dupL.assignedTo ? ' مع ' + userName(dupL.assignedTo) : ''}`);
    const to = isAdmin() ? ($('#nlTo').value || null) : S.me.uid;
    const now = Date.now(), note = $('#nlNote').value.trim();
    const ct = $('#nlCt').value || null;
    const lead = {name:$('#nlName').value.trim(), phone, project:$('#nlProj').value.trim(), unit:$('#nlUnit').value.trim(), extra:note ? {'ملاحظات':note} : {},
      clientType:ct, source:$('#nlSrc').value || null, furnished:['owner_rent', 'tenant'].includes(ct) ? ($('#nlFurn').value || null) : null,
      status:'new', assignedTo:to, teamId:teamOf(to), assignedAt:to ? now : null, createdAt:now, createdBy:S.me.uid,
      lastContactAt:null, nextFollowUp:null, callCount:0, history:[]};
    const b = $('#nlBtn'); b.disabled = true; b.textContent = 'بيضيف...';
    try{
      await store.addLeads([lead]);
      await store.addActivity({type:'upload', at:now, by:S.me.uid, byName:S.me.name, note:`ضاف عميل جديد: ${lead.name}${to && to !== S.me.uid ? ' — لـ ' + userName(to) : ''}`, teamId:teamOf(to) || myTeam()});
      closeSheet(); toast('اتضاف العميل ✓');
    }catch(err){ toast(fbError(err)); b.disabled = false; b.textContent = 'إضافة العميل'; }
  },

  /* الوحدات */
  uf(k, v){ S.uf[k] = S.uf[k] === v && k !== 'purpose' ? (k === 'mine' ? false : k === 'beds' ? '' : 'all') : v; S.ulimit = 60; render(); },
  uclear(){ S.uf = {q:S.uf.q, purpose:'all', furn:'all', st:'all', mine:false, beds:''}; render(); },
  usearch(v){ S.uf.q = v; S.ulimit = 60; const el = $('#ulist'); if(el) el.innerHTML = unitListHTML(); },
  umore(){ S.ulimit += 100; render(); },
  openUnit(id){
    const u = unitById(id); if(!u) return toast('الوحدة دي مش موجودة');
    recCleanup(); S.openUnitId = id; openSheet(unitSheet(u)); fillPhotos(u); fillOwner(u);
  },
  async unitForm(id, pre){
    const u = id ? unitById(id) : null;
    let owner = null;
    if(u && canSeeOwner(u)){ try{ owner = S.ownerCache[u.id] !== undefined ? S.ownerCache[u.id] : (S.ownerCache[u.id] = await store.getOwner(u.id)); }catch(e){} }
    S._formOwnerOk = !u || !!owner; S._preLead = pre || null;
    openSheet(unitFormSheet(u, owner, pre));
  },
  unitFromLead(leadId){
    const l = leadById(leadId); if(!l) return;
    App.unitForm(null, {ownerName:l.name, ownerPhone:l.phone, project:l.project, unitNo:l.unit, furnished:l.furnished || '',
      purpose:l.clientType === 'owner_rent' ? 'rent' : 'sale', agentId:l.assignedTo || S.me.uid, leadId:l.id});
  },
  async saveUnit(e, id){
    e.preventDefault();
    const old = id ? unitById(id) : null;
    const g = s => ($(s) ? $(s).value.trim() : '');
    const st = g('#uSt') || 'available';
    const agentId = isAdmin() ? (g('#uAgent') || null) : (old ? old.agentId : S.me.uid);
    const agentUser = agentId ? S.users[agentId] : null;
    const data = {project:g('#uProj'), phase:g('#uPhase'), unitNo:g('#uNo'), code:g('#uCode') || (old && old.code) || ('BL-' + Date.now().toString(36).toUpperCase().slice(-6)),
      purpose:g('#uPurp'), type:g('#uType'), bedrooms:g('#uBeds'), bathrooms:g('#uBaths'), floor:g('#uFloor'), bua:g('#uBua'), land:g('#uLand'),
      finishing:g('#uFin'), furnished:g('#uFurn'), price:g('#uPrice'), downPayment:g('#uDp'), delivery:g('#uDel'), status:st,
      availableFrom:st === 'rented' && g('#uAv') ? new Date(g('#uAv') + 'T12:00').getTime() : null, notes:g('#uNotes'),
      agentId, agentName:agentUser ? agentUser.name : (agentId === S.me.uid ? S.me.name : (old && old.agentId === agentId ? old.agentName : '')),
      teamId:agentId ? teamOf(agentId) : (isLeader() ? S.me.uid : null)};
    const owner = {ownerName:g('#uOName'), ownerPhone:normalizePhone(g('#uOPhone')), otherPhone:g('#uOther'), agentId:data.agentId, teamId:data.teamId};
    if(!isBoss() && !data.agentId && !isLeader()) return toast('لازم الوحدة تبقى مع سيلز');
    const b = $('#uSave'); b.disabled = true; b.textContent = 'بيحفظ...';
    try{
      let uid = id;
      if(old){ await store.saveUnit(old.page, id, data); }
      else{
        uid = newUid();
        const pre = S._preLead;
        await store.addUnit(uid, {...data, photos:[], createdAt:Date.now(), createdBy:S.me.uid, leadId:(pre && pre.leadId) || null});
      }
      if(!old || S._formOwnerOk || owner.ownerName || owner.ownerPhone){ await store.setOwner(uid, {...owner, unitId:uid}); S.ownerCache[uid] = owner; }
      else if(isBoss() && (old.agentId !== data.agentId)){ await store.setOwner(uid, {agentId:data.agentId, teamId:data.teamId, unitId:uid}); delete S.ownerCache[uid]; }
      if(!old) await store.addActivity({type:'upload', at:Date.now(), by:S.me.uid, byName:S.me.name, note:`ضاف وحدة: ${[data.type, data.project, data.unitNo].filter(Boolean).join(' · ')}`, teamId:data.teamId || myTeam()});
      toast('اتحفظت الوحدة ✓');
      setTimeout(() => App.openUnit(uid), 150);
    }catch(err){ toast(fbError(err)); b.disabled = false; b.textContent = 'حفظ'; }
  },
  async delUnit(id){
    const b = $('#udelBtn'), u = unitById(id); if(!u) return;
    if(!b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'متأكد؟ دوس تاني للمسح'; return; }
    try{ await store.deleteUnit(u.page, id, u.photos || []); closeSheet(); toast('اتمسحت'); }catch(e){ toast(fbError(e)); }
  },
  async addPhotos(id, files){
    const u = unitById(id); if(!u || !files || !files.length) return;
    const room = MAX_PHOTOS - (u.photos || []).length;
    const list = Array.from(files).slice(0, Math.max(0, room));
    if(files.length > room) toast(`أقصى عدد ${MAX_PHOTOS} صور للوحدة — هيترفع ${list.length} بس`);
    const stEl = () => $('#phStatus');
    let done = 0;
    for(const f of list){
      if(stEl()) stEl().textContent = `بيجهّز الصور ويحط اللوجو... ${done + 1} من ${list.length}`;
      try{
        const b64 = await processPhoto(f);
        const pid = await store.savePhoto(b64, {unitId:id, by:S.me.uid, at:Date.now()});
        S.photoCache[pid] = 'data:image/jpeg;base64,' + b64;
        await store.addUnitPhoto(u.page, id, pid);
        done++;
      }catch(e){ toast('صورة مترفعتش: ' + fbError(e)); }
    }
    if(stEl()) stEl().textContent = '';
    toast(`اترفع ${done} صورة ✓`);
    setTimeout(() => { if(S.openUnitId === id) App.openUnit(id); }, 200);
  },
  async viewPhoto(pid){
    const src = S.photoCache[pid] || await loadPhotoURL(pid).catch(() => '');
    if(!src) return;
    const u = unitById(S.openUnitId);
    const canDel = u && (isBoss() || canEditUnit(u));
    const lb = $('#lb'); lb.innerHTML = `<img src="${src}" alt=""><div class="lb-bar">
      <a class="btn ghost mini" href="${src}" download="blue-${esc((u && u.code) || 'unit')}.jpg" onclick="event.stopPropagation()">حفظ الصورة</a>
      ${canDel ? `<button class="btn danger mini" onclick="event.stopPropagation();App.delPhoto('${esc(pid)}')">امسح الصورة</button>` : ''}
      <button class="btn mini" onclick="App.closeLb()">قفل</button></div>`;
    lb.classList.remove('hidden');
  },
  closeLb(){ const lb = $('#lb'); lb.classList.add('hidden'); lb.innerHTML = ''; },
  async delPhoto(pid){
    const u = unitById(S.openUnitId); if(!u) return;
    try{ await store.removeUnitPhoto(u.page, u.id, pid); App.closeLb(); toast('اتمسحت الصورة'); setTimeout(() => App.openUnit(u.id), 150); }catch(e){ toast(fbError(e)); }
  },
  async sharePhotos(id){
    const u = unitById(id); if(!u) return;
    const text = unitShareText(u);
    try{
      toast('بيجهّز الصور...');
      const files = [];
      for(const [i, pid] of (u.photos || []).entries()){
        const src = await loadPhotoURL(pid); if(!src) continue;
        files.push(new File([b64ToBlob(src.split(',')[1], 'image/jpeg')], `blue-${(u.code || 'unit').replace(/[^\w-]/g, '')}-${i + 1}.jpg`, {type:'image/jpeg'}));
      }
      if(navigator.canShare && navigator.canShare({files})){ await navigator.share({files, text}); return; }
      if(navigator.share){ await navigator.share({text}); toast('الموبايل ده مش بيبعت صور من هنا — افتح كل صورة واحفظها'); return; }
      App.copyText(text); toast('اتنسخت التفاصيل — افتح كل صورة واحفظها');
    }catch(e){ if(e && e.name !== 'AbortError') toast('مقدرتش أشارك: ' + (e.message || e)); }
  },
  async shareUnitText(id){
    const u = unitById(id); if(!u) return;
    const text = unitShareText(u);
    try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
    App.copyText(text);
  },
  copyText(t){ try{ navigator.clipboard.writeText(t).then(() => toast('اتنسخ ✓'), () => toast('مقدرتش أنسخ')); }catch(e){ toast('مقدرتش أنسخ'); } },

  /* رفع شيت الإنفنتوري */
  invFile(f){
    if(!f) return;
    if(typeof XLSX === 'undefined') return toast('مكتبة الإكسل لسه بتحمّل، جرّب كمان ثانية');
    const r = new FileReader();
    r.onload = ev => {
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false, blankrows:false});
        const hi = rows.findIndex(r => r.filter(c => String(c).trim()).length >= 3);
        if(hi < 0) return toast('الشيت فاضي أو مش مفهوم');
        const headers = rows[hi].map(c => String(c).trim());
        S.inv = {fileName:f.name, headers, rows:rows.slice(hi + 1), map:invMap(headers), agentMap:null};
        render(); window.scrollTo(0, 0);
      }catch(e){
        toast(/password|encrypt/i.test(String(e && e.message)) ? 'الشيت عليه باسورد — شيل الباسورد الأول من الإكسل وارفعه تاني' : 'مش قادر أقرا الملف ده');
      }
    };
    r.readAsArrayBuffer(f);
  },
  invCancel(){ S.inv = null; render(); },
  invAgent(i, uid){ const P = invPrepare(); const a = Object.entries(P.agents).sort((x, y) => y[1] - x[1])[i]; if(a) S.inv.agentMap[a[0]] = uid || ''; render(); },
  async invDo(){
    const P = invPrepare(), now = Date.now(), b = $('#invBtn');
    b.disabled = true;
    const units = [], owners = [];
    P.units.forEach((x, i) => {
      const id = newUid() + i.toString(36);
      const agentId = S.inv.agentMap[x.agentRaw] || null;
      const au = agentId ? S.users[agentId] : null;
      const teamId = agentId ? teamOf(agentId) : null;
      const {_owner, agentRaw, ...rest} = x;
      units.push({...rest, id, code:rest.code || ('BL-' + (now + i).toString(36).toUpperCase().slice(-6)), agentId, agentName:au ? au.name : agentRaw, teamId,
        status:'available', availableFrom:null, photos:[], notes:'', createdAt:now, createdBy:S.me.uid, src:S.inv.fileName});
      owners.push({id, data:{..._owner, agentId, teamId, unitId:id}});
    });
    try{
      await store.importUnits(units, owners, (n, t) => { b.textContent = `بيرفع... ${n} من ${t}`; });
      await store.addActivity({type:'upload', at:Date.now(), by:S.me.uid, byName:S.me.name, note:`رفع ${units.length} وحدة للإنفنتوري من ${S.inv.fileName}`, teamId:null});
      S.inv = null; toast(`اترفع ${units.length} وحدة ✓`); render();
    }catch(e){ toast(fbError(e)); b.disabled = false; b.textContent = 'ارفع تاني'; }
  }
});

// تحديث "من كام دقيقة" والمتأخرين كل دقيقة
setInterval(() => { if(S.me && !document.activeElement.matches('input,textarea,select')) render(); }, 60000);
