<style>
:root{
  --navy:#0B2A5B; --navy2:#123A7A; --accent:#1E5BB8; --bg:#F2F4F8; --card:#fff;
  --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --late:#DC2626; --today:#D97706; --ok:#16A34A;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.logo{height:44px;width:auto;display:block}
.logo-big{display:block;height:110px;width:auto;margin:0 auto 10px}
.brand{flex:1;line-height:1.15}
.brand b{font-size:22px;font-weight:800;letter-spacing:.5px;font-family:Georgia,"Times New Roman",serif}
.brand small{display:block;opacity:.75;font-size:12px}
.who{font-size:12px;text-align:left;opacity:.9}
.who button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:4px 10px;margin-top:3px;font-size:12px}
.demo-bar{background:#FEF3C7;color:#78350F;font-size:12.5px;padding:7px 16px;text-align:center}

main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
h2{font-size:18px;margin:6px 2px 12px}
h3{font-size:15px;margin:18px 2px 8px;color:var(--navy)}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 2px rgba(15,23,42,.05);border:1px solid var(--line)}
.stack>*+*{margin-top:10px}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--navy);background:#EAF0FA}
.nav .dot{position:absolute;top:2px;left:calc(50% - 20px);background:var(--late);color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}

/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:right}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.late b{color:var(--late)} .kpi.today b{color:var(--today)} .kpi.ok b{color:var(--ok)}
button.kpi{border:1px solid var(--line);font:inherit}

.alert{display:flex;gap:10px;align-items:center;background:#FEF2F2;border:1px solid #FECACA;color:#7F1D1D;border-radius:var(--r);padding:12px;width:100%;text-align:right}
.alert b{font-size:20px}

/* team table */
.team-row{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:4px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:center;font-size:13px}
.team-row:last-child{border-bottom:0}
.team-row .n{text-align:right;font-weight:700}
.team-row .n small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.team-head{color:var(--muted);font-size:11.5px;font-weight:600}
.c-late{color:var(--late);font-weight:700} .c-ok{color:var(--ok);font-weight:700}

/* leads */
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip i{font-style:normal;opacity:.7;margin-right:3px}
select.sel{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-top:6px}

.lead{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:8px}
.lead:active{background:#F8FAFC}
.lead-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lead-top b{font-size:15.5px}
.lead-sub{color:var(--muted);font-size:13px;margin-top:2px}
.lead-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}
.pill{--c:#64748B;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);border-radius:99px;padding:2px 10px;white-space:nowrap}
.due{font-weight:700}
.due.late{color:var(--late)} .due.today{color:var(--today)} .due.soon{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.more{display:block;margin:14px auto 0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 18px}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--navy);color:#fff;text-decoration:none}
.btn.block{width:100%}
.btn.ghost{background:#EEF2F8;color:var(--navy)}
.btn.green{background:#16A34A} .btn.wa{background:#25A244}
.btn.danger{background:#FEE2E2;color:#B91C1C}
.btn:disabled{opacity:.55}
.btn svg{width:18px;height:18px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.in{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:80px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:#CBD5E1;margin:4px auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-h h2{margin:0}
.x{border:0;background:#E2E8F0;border-radius:99px;width:32px;height:32px;font-size:18px;line-height:1;flex:none}
.phone{direction:ltr;display:inline-block;font-weight:700;color:var(--navy);font-size:16px;letter-spacing:.5px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13.5px}
.details div span{display:block;color:var(--muted);font-size:12px}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st-grid label{position:relative}
.st-grid input{position:absolute;opacity:0}
.st-grid span{display:block;text-align:center;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px}
.st-grid input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);color:var(--c)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px}
.tl{position:relative;padding-right:16px}
.tl:before{content:"";position:absolute;right:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:4px 0 12px}
.tl-i:before{content:"";position:absolute;right:-15px;top:9px;width:10px;height:10px;border-radius:99px;background:var(--c,#94A3B8)}
.tl-i .t{font-size:12px;color:var(--muted)}
.tl-i .note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:4px;font-size:13.5px;white-space:pre-wrap}

/* upload */
.drop{display:block;border:2px dashed #94A3B8;border-radius:var(--r);padding:28px 14px;text-align:center;background:#fff;cursor:pointer}
.drop b{display:block;font-size:16px;color:var(--navy)}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.prev{overflow-x:auto;margin-top:8px}
.prev table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.prev td,.prev th{border:1px solid var(--line);padding:5px 8px;white-space:nowrap;background:#fff}
.prev th{background:#EEF2F8}
.dist-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dist-row:last-child{border-bottom:0}
.dist-row label{flex:1;display:flex;align-items:center;gap:8px;font-weight:600}
.dist-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--navy)}
.dist-row input[type=number]{width:80px;padding:7px;border:1px solid var(--line);border-radius:10px;text-align:center}
.sum{display:flex;justify-content:space-between;font-weight:700;padding-top:10px}
.sum .bad{color:var(--late)}

/* activity */
.act{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px;background:#EEF2F8;color:var(--navy);font-weight:800}
.act .tx{flex:1;font-size:13.5px}
.act .tx .note{color:#334155;background:#F8FAFC;border-radius:8px;padding:6px 8px;margin-top:4px;white-space:pre-wrap}
.act .t{font-size:11.5px;color:var(--muted);margin-top:2px}

/* login */
.login{max-width:420px;margin:30px auto;padding:0 16px}
.login h1{text-align:center;margin:0 0 4px;color:var(--navy);font-family:Georgia,"Times New Roman",serif;letter-spacing:1px}
.err{background:#FEF2F2;color:#B91C1C;border-radius:10px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.user-pick{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:7px;text-align:right}
.user-pick small{color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.cred{background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:12px;font-size:14px}
.cred code{direction:ltr;display:inline-block;background:#fff;padding:1px 8px;border-radius:6px;font-weight:700}
.voice-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
#recBox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#recBox audio,.vplay audio{height:36px;max-width:230px}
.rec-dot{width:10px;height:10px;border-radius:99px;background:#DC2626;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec-time{font-weight:700;color:#DC2626;direction:ltr;min-width:42px}
.vbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--navy);margin-top:5px}
.btn.rec{background:#FEE2E2;color:#B91C1C}
.btn.listening{background:#DC2626;color:#fff}
.switch{position:relative;width:46px;height:26px;flex:none}
.dist-row label.switch,.staff label.switch{flex:none;display:inline-block}
.staff{padding:11px 0;border-bottom:1px solid var(--line)}
.staff:last-child{border-bottom:0}
.staff-top{display:flex;align-items:center;gap:10px}
.staff-ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sel.mini{width:auto;margin:0;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.mini{padding:6px 12px;font-size:12.5px;border-radius:10px}
.role-tag{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:#EEF2F8;color:var(--navy);white-space:nowrap}
.r-leader{background:#FEF3C7;color:#92400E}.r-manager{background:#DCFCE7;color:#166534}.r-admin{background:#E0E7FF;color:#3730A3}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#CBD5E1;border-radius:99px;transition:.2s}
.switch span:before{content:"";position:absolute;width:20px;height:20px;top:3px;right:3px;background:#fff;border-radius:99px;transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{right:23px}

const $ = s => document.querySelector(s);

const startOfDay = (t = Date.now()) => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const timeStr = ms => new Date(ms).toLocaleTimeString('ar-EG', {hour:'numeric', minute:'2-digit'});
const fmt = ms => new Date(ms).toLocaleString('ar-EG', {weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'});
function ago(ms){
  if(!ms) return 'لسه';
  const m = Math.round((Date.now() - ms) / 6e4);
  if(m < 1) return 'دلوقتي';
  if(m < 60) return `من ${m} دقيقة`;
  const h = Math.round(m / 60);
  if(h < 24) return `من ${h} ساعة`;
  const d = Math.round(h / 24);
  return d === 1 ? 'امبارح' : `من ${d} يوم`;
}
function dueLabel(ms){
  const now = Date.now(), t0 = startOfDay();
  if(ms < now) return {txt:'متابعة متأخرة · ' + fmt(ms), cls:'late'};
  if(ms < t0 + DAY) return {txt:'متابعة النهارده ' + timeStr(ms), cls:'today'};
  if(ms < t0 + 2*DAY) return {txt:'متابعة بكرة ' + timeStr(ms), cls:'soon'};
  return {txt:'متابعة ' + fmt(ms), cls:'later'};
}
const toLocalInput = ms => { const d = new Date(ms - new Date(ms).getTimezoneOffset()*6e4); return d.toISOString().slice(0,16); };
function normalizePhone(v){
  let s = String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d+]/g, '');
  if(s.startsWith('+20')) s = '0' + s.slice(3);
  else if(s.startsWith('0020')) s = '0' + s.slice(4);
  else if(s.startsWith('20') && s.length === 12) s = '0' + s.slice(2);
  else if(s.length === 10 && s.startsWith('1')) s = '0' + s;
  return s.replace(/\+/g, '');
}
const waLink = p => { const d = normalizePhone(p); return 'https://wa.me/' + (d.startsWith('0') ? '2' + d : d); };
const isOverdue = l => !!l.nextFollowUp && l.nextFollowUp < Date.now() && OPEN.has(l.status);
const isDueToday = l => !!l.nextFollowUp && l.nextFollowUp >= Date.now() && l.nextFollowUp < startOfDay() + DAY && OPEN.has(l.status);
function isStale(l){
  if(!l.assignedTo || !OPEN.has(l.status)) return false;
  if(l.nextFollowUp && l.nextFollowUp > Date.now()) return false;
  const ref = l.lastContactAt || l.assignedAt || l.createdAt;
  return Date.now() - ref > STALE_DAYS * DAY;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function fbError(e){
  const c = e && e.code || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return 'اسم الدخول أو كلمة السر غلط';

  if(/too-many-requests/.test(c)) return 'محاولات كتير. استنى شوية وجرّب تاني';
  if(/network/.test(c)) return 'مفيش نت أو النت ضعيف';
  if(/permission-denied/.test(c)) return 'مش مسموحلك تعمل الحركة دي';
  return 'حصلت مشكلة: ' + (e && e.message || e);
}

  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>'

/* =====================================================================
   مخزن البيانات — نسخة تجريبية (على الجهاز)
   ===================================================================== */
function demoSeed(){
  const now = Date.now(), H = 36e5;
  const users = {admin:{uid:'admin', name:'عاطف محمد', login:'admin', role:'admin', active:true, createdAt:now}};
  ['أحمد محمد','أحمد سلام','أحمد حسين','كريم علي','كريم فوزي','عمر عبد الرحمن','عمر حسن','أحمد واعر','مصطفى الصريف','محمد خميس']
    .forEach((n, i) => users['s' + (i+1)] = {uid:'s' + (i+1), name:n, login:'sales' + (i+1), role:'sales', leaderId:null, active:true, createdAt:now});
  // في النسخة التجريبية: أحمد محمد تيم ليدر، وأحمد سلام وأحمد حسين في فريقه
  users.s1.role = 'leader'; users.s2.leaderId = 's1'; users.s3.leaderId = 's1';
  const teamOfSeed = s => !s ? null : users[s].role === 'leader' ? s : (users[s].leaderId || null);
  const names = ['محمود السيد','هالة عبد العزيز','شريف منصور','نورا كمال','ياسر فتحي','دينا رشاد','طارق نبيل','مها سمير','حسام عادل','رانيا مجدي','وليد شوقي','سلمى إبراهيم','خالد ممدوح','منى جلال','إيهاب صبري','ريم الشاذلي'];
  const projects = ['زايد ريزيدنس','جرين فالي','الكورت يارد','سما زايد'];
  const plan = [ // [sales, status, hoursSinceContact|null, followUpOffsetHours|null, note]
    ['s1','interested',26,-3,'عايز شقة 3 أوض، ميزانيته في حدود 6 مليون، طلب يشوف الموديل'],
    ['s1','followup',3,5,'قال كلّمني بالليل بعد 8 عشان يكون مع مراته'],
    ['s1','new',null,null,''],
    ['s1','noanswer',20,2,'ماردش مرتين'],
    ['s2','notinterested',30,null,'اشترى خلاص من مكان تاني'],
    ['s2','new',null,null,''],
    ['s2','interested',5,48,'عايز تقسيط على 8 سنين، هبعتله العروض واتساب'],
    ['s3','new',null,null,''],
    ['s3','new',null,null,''],
    ['s3','followup',50,-20,'طلب أبعتله أسعار الدور الأرضي بجنينة'],
    ['s4','closed',4,null,'دفع المقدم وحجز الوحدة 🎉'],
    ['s4','wrong',28,null,'الرقم مش بتاعه'],
    ['s4','interested',2,24,'معاد معاينة بكرة الساعة 1 الضهر'],
    [null,'new',null,null,''],
    [null,'new',null,null,''],
    [null,'new',null,null,'']
  ];
  const leads = {}, acts = [];
  plan.forEach(([s, st, hc, fu, note], i) => {
    const id = 'L' + (i+1);
    const assignedAt = s ? now - 3*DAY : null;
    const l = {id, name:names[i], phone:'010' + String(10000000 + i*7919123 % 89999999).slice(0,8), project:projects[i%4],
      unit:String(100 + i*7), extra:{}, status:st, assignedTo:s, teamId:teamOfSeed(s), assignedAt, createdAt:now - 3*DAY,
      lastContactAt: hc ? now - hc*H : null, nextFollowUp: fu != null ? now + fu*H : null, callCount: hc ? 1 : 0, history:[], source:'بيانات تجريبية'};
    if(hc){
      const h = {at:now - hc*H, by:s, byName:users[s].name, status:st, note, nextFollowUp:l.nextFollowUp};
      l.history.push(h);
      acts.push({type:'call', at:h.at, by:s, byName:users[s].name, leadId:id, leadName:l.name, status:st, note, assignedTo:s, teamId:l.teamId});
    }
    leads[id] = l;
  });
  acts.push({type:'upload', at:now - 3*DAY, by:'admin', byName:'عاطف محمد', note:'رفع 16 عميل من بيانات تجريبية'});
  return {users, leads, activities:acts};
}

function makeDemoStore(){
  const KEY = 'bluecrm_demo_v2';
  let db = null, me = null, authCb = null;
  try{ db = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){}
  if(!db) db = demoSeed();
  const subs = new Set();
  const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} subs.forEach(f => f()); };
  const sub = fn => { subs.add(fn); fn(); return () => subs.delete(fn); };
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
  return {
    mode:'demo',
    init(cb){ authCb = cb; cb(null); },
    demoUsers(){ return Object.values(db.users); },
    demoLogin(id){ me = db.users[id]; authCb(clone(me)); },
    signOut(){ me = null; authCb(null); },
    resetDemo(){ db = demoSeed(); persist(); },
    onUsers(cb){ return sub(() => {
      if(BOSS_ROLES.includes(me.role)) return cb(clone(db.users));
      const o = {}; Object.values(db.users).forEach(u => { if(u.uid === me.uid || (me.role === 'leader' && u.leaderId === me.uid)) o[u.uid] = clone(u); }); cb(o);
    }); },
    onLeads(cb){ return sub(() => cb(Object.values(db.leads).filter(l => BOSS_ROLES.includes(me.role) || (me.role === 'leader' ? l.teamId === me.uid : l.assignedTo === me.uid)).map(clone))); },
    onActivities(cb){ return sub(() => cb(BOSS_ROLES.includes(me.role) ? clone(db.activities).sort((a,b) => b.at - a.at).slice(0, 300)
      : me.role === 'leader' ? clone(db.activities.filter(a => a.teamId === me.uid)).sort((a,b) => b.at - a.at).slice(0, 300) : [])); },
    async addLeads(list){ list.forEach(l => { const id = uid(); db.leads[id] = {...clone(l), id}; }); persist(); },
    async updateLeads(ids, patch, hist){
      ids.forEach(id => { const l = db.leads[id]; if(!l) return; Object.assign(l, clone(patch)); if(hist) l.history.push(clone(hist)); });
      persist();
    },
    async deleteLeads(ids){ ids.forEach(id => delete db.leads[id]); persist(); },
    async addActivity(a){ db.activities.push(clone(a)); persist(); },
    _voices:{},
    async saveVoice(b64){ const id = uid(); this._voices[id] = b64; return {id, n:1}; },
    async loadVoice(id){ if(!this._voices[id]) throw {message:'الفويس ده مش موجود في النسخة التجريبية'}; return this._voices[id]; },
    async createSales({name, login, role = 'sales', leaderId = null}){
      if(Object.values(db.users).some(u => u.login === login)) throw {code:'email-already-in-use'};
      const id = uid(); db.users[id] = {uid:id, name, login, role, leaderId, active:true, createdAt:Date.now()}; persist();
    },
    async updateUser(id, patch){ Object.assign(db.users[id], patch); persist(); },
    async resetSales(u){ return Object.values(db.leads).filter(l => l.assignedTo === u.uid).length; }
  };
}

/* =====================================================================
   مخزن البيانات — Firebase (النسخة الحقيقية لكل الفريق)
   ===================================================================== */
function makeFirebaseStore(){
  let auth, db, FV, me = null;
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src)); document.head.appendChild(s); });
  const onErr = e => toast(fbError(e));
  const chunks = (arr, n = 400) => { const out = []; for(let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
  return {
    mode:'firebase',
    async init(cb){
      try{
        await load(base + 'firebase-app-compat.js');
        await load(base + 'firebase-auth-compat.js');
        await load(base + 'firebase-firestore-compat.js');
      }catch(e){ cb({error:'مش قادر أوصل لـ Firebase. اتأكد إن النت شغال وجرّب تاني.'}); return; }
      if(typeof firebase === 'undefined'){ cb({error:'مش قادر أوصل لـ Firebase. اتأكد إن النت شغال وجرّب تاني.'}); return; }
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth(); db = firebase.firestore(); FV = firebase.firestore.FieldValue;
      try{ await db.enablePersistence({synchronizeTabs:true}); }catch(e){}
      auth.onAuthStateChanged(async u => {
        if(!u){ me = null; return cb(null); }
        try{
          const ref = db.collection('users').doc(u.uid);
          let snap = await ref.get();
          if(!snap.exists && (u.email || '').toLowerCase() === ADMIN_EMAIL){
            await ref.set({name:'عاطف محمد', login:ADMIN_EMAIL, role:'admin', active:true, createdAt:Date.now()});
            snap = await ref.get();
          }
          if(!snap.exists){ await auth.signOut(); return cb({error:'الحساب ده مش متسجّل في السيستم. كلّم الأدمن.'}); }
          const d = snap.data();
          if(!d.active){ await auth.signOut(); return cb({error:'الحساب ده متوقف. كلّم الأدمن.'}); }
          me = {uid:u.uid, ...d}; cb(me);
        }catch(e){ cb({error:fbError(e)}); }
      });
    },
    async signIn(login, pw){
      if(!auth) throw {message:'السيستم لسه بيحمّل، استنى ثانية وجرّب تاني'};
      let email = login.trim();
      if(!email.includes('@')){
        const l = email.toLowerCase(); email = `${l}@${LOGIN_DOMAIN}`;
        try{ const d = await db.collection('logins').doc(l).get(); if(d.exists && d.data().email) email = d.data().email; }catch(e){}
      }
      await auth.signInWithEmailAndPassword(email, pw);
    },
    async registerAdmin(pw){ await auth.createUserWithEmailAndPassword(ADMIN_EMAIL, pw); },
    signOut(){ return auth.signOut(); },
    onUsers(cb){
      if(BOSS_ROLES.includes(me.role))
        return db.collection('users').onSnapshot(s => { const o = {}; s.forEach(d => o[d.id] = {uid:d.id, ...d.data()}); cb(o); }, onErr);
      if(me.role === 'leader')
        return db.collection('users').where('leaderId', '==', me.uid).onSnapshot(s => { const o = {[me.uid]:me}; s.forEach(d => o[d.id] = {uid:d.id, ...d.data()}); cb(o); }, onErr);
      cb({[me.uid]:me}); return () => {};
    },
    onLeads(cb){
      let q = db.collection('leads');
      if(me.role === 'leader') q = q.where('teamId', '==', me.uid);
      else if(!BOSS_ROLES.includes(me.role)) q = q.where('assignedTo', '==', me.uid);
      return q.onSnapshot(s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), onErr);
    },
    onActivities(cb){
      if(BOSS_ROLES.includes(me.role))
        return db.collection('activities').orderBy('at', 'desc').limit(300).onSnapshot(s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), onErr);
      if(me.role === 'leader')
        return db.collection('activities').where('teamId', '==', me.uid).onSnapshot(s => cb(s.docs.map(d => ({id:d.id, ...d.data()})).sort((a, b) => b.at - a.at).slice(0, 300)), onErr);
      cb([]); return () => {};
    },
    async addLeads(list){
      for(const part of chunks(list)){ const b = db.batch(); part.forEach(l => b.set(db.collection('leads').doc(), l)); await b.commit(); }
    },
    async updateLeads(ids, patch, hist){
      const data = hist ? {...patch, history:FV.arrayUnion(hist)} : patch;
      for(const part of chunks(ids)){ const b = db.batch(); part.forEach(id => b.update(db.collection('leads').doc(id), data)); await b.commit(); }
    },
    async deleteLeads(ids){
      for(const part of chunks(ids)){ const b = db.batch(); part.forEach(id => b.delete(db.collection('leads').doc(id))); await b.commit(); }
    },
    async addActivity(a){ await db.collection('activities').add(a); },
    // الفويس بيتحفظ في Firestore نفسه مقسوم على أجزاء (من غير Storage المدفوع)
    async saveVoice(b64, meta){
      const id = db.collection('voices').doc().id, size = 700000, parts = [];
      for(let i = 0; i < b64.length; i += size) parts.push(b64.slice(i, i + size));
      const b = db.batch();
      parts.forEach((data, i) => b.set(db.collection('voices').doc(`${id}_${i}`), {...meta, i, n:parts.length, data}));
      await b.commit();
      return {id, n:parts.length};
    },
    async loadVoice(id, n){
      const docs = await Promise.all(Array.from({length:n}, (_, i) => db.collection('voices').doc(`${id}_${i}`).get()));
      return docs.map(d => d.exists ? d.data().data : '').join('');
    },
    async createSales({name, login, password, role = 'sales', leaderId = null}){
      const sec = firebase.apps.find(a => a.name === 'secondary') || firebase.initializeApp(firebaseConfig, 'secondary');
      const c = await sec.auth().createUserWithEmailAndPassword(`${login}@${LOGIN_DOMAIN}`, password);
      await db.collection('users').doc(c.user.uid).set({name, login, role, leaderId, active:true, createdAt:Date.now()});
      await sec.auth().signOut();
    },
    async updateUser(id, patch){ await db.collection('users').doc(id).update(patch); },
    // كلمة سر جديدة: حساب دخول جديد بنفس اسم الدخول، وكل العملاء بيتنقلوا عليه، والقديم بيتقفل
    async resetSales(u, password){
      const sec = firebase.apps.find(a => a.name === 'secondary') || firebase.initializeApp(firebaseConfig, 'secondary');
      const email = `${u.login}.r${Date.now().toString(36)}@${LOGIN_DOMAIN}`;
      const c = await sec.auth().createUserWithEmailAndPassword(email, password);
      const nu = c.user.uid;
      await db.collection('users').doc(nu).set({name:u.name, login:u.login, role:u.role, leaderId:u.leaderId || null, active:true, createdAt:u.createdAt || Date.now(), prevUids:[...(u.prevUids || []), u.uid]});
      await db.collection('logins').doc(u.login).set({email});
      const snap = await db.collection('leads').where('assignedTo', '==', u.uid).get();
      const ids = snap.docs.map(d => d.id);
      for(const part of chunks(ids)){ const b = db.batch(); part.forEach(id => b.update(db.collection('leads').doc(id), {assignedTo:nu})); await b.commit(); }
      if(u.role === 'leader'){ // الفريق وعملاؤه ينتقلوا مع التيم ليدر
        const tm = await db.collection('users').where('leaderId', '==', u.uid).get();
        for(const part of chunks(tm.docs)){ const b = db.batch(); part.forEach(d => b.update(d.ref, {leaderId:nu})); await b.commit(); }
        const tl = await db.collection('leads').where('teamId', '==', u.uid).get();
        for(const part of chunks(tl.docs)){ const b = db.batch(); part.forEach(d => b.update(d.ref, {teamId:nu})); await b.commit(); }
      }
      await db.collection('users').doc(u.uid).update({active:false, replacedBy:nu});
      await sec.auth().signOut();
      return ids.length;
    }
  };
}

const store = firebaseConfig.apiKey ? makeFirebaseStore() : makeDemoStore();
const S = {
  me:null, authErr:'', users:{}, leads:[], acts:[], tab:null, unsub:[], leadsLoaded:false,
  f:{q:'', status:'all', sales:'all', special:''}, limit:60,
  upload:null, dist:null, openId:null, newCred:null, actFilter:'all', regMode:false
};
const isAdmin = () => !!S.me && ['admin','manager','leader'].includes(S.me.role);   // شاشات الإدارة (أدمن / مدير / تيم ليدر)
const isBoss = () => !!S.me && BOSS_ROLES.includes(S.me.role);                     // يشوف كل حاجة
const isOwner = () => !!S.me && S.me.role === 'admin';
const isLeader = () => !!S.me && S.me.role === 'leader';
const myTeam = () => isLeader() ? S.me.uid : null;
function teamOf(uid){
  if(!uid) return myTeam();
  const u = S.users[uid]; if(!u) return myTeam();
  if(u.role === 'leader') return u.uid;
  return u.leaderId || null;
}
const userName = id => id ? (S.users[id] ? S.users[id].name : (S.me && id === S.me.uid ? S.me.name : '—')) : 'مش متوزع';
// اللي ينفع يتوزع عليهم عملاء (سيلز + تيم ليدرز) في نطاق اللي فاتح
const activeSales = () => Object.values(S.users).filter(u => ['sales','leader'].includes(u.role) && u.active && !u.replacedBy
  && (isBoss() || u.uid === S.me.uid || u.leaderId === S.me.uid)).sort((a,b) => (ROLE_RANK[a.role] - ROLE_RANK[b.role]) || a.name.localeCompare(b.name, 'ar'));
const leadById = id => S.leads.find(l => l.id === id);
const salesList = () => Object.values(S.users).filter(u => ['sales','leader'].includes(u.role) && !u.replacedBy
  && (isBoss() || u.uid === S.me.uid || u.leaderId === S.me.uid));
// الموظفين اللي يظهروا في صفحة الفريق
const staffList = () => Object.values(S.users).filter(u => u.role !== 'admin' && !u.replacedBy && u.uid !== S.me.uid
  && (isBoss() || u.leaderId === S.me.uid));
const uidsOf = id => { const u = S.users[id]; return u ? [u.uid, ...(u.prevUids || [])] : [id]; };

render();
store.init(onAuth);

function onAuth(me){
  S.unsub.forEach(f => f && f()); S.unsub = [];
  if(!me || me.error){ S.me = null; S.authErr = me && me.error || ''; S.users = {}; S.leads = []; S.acts = []; S.leadsLoaded = false; closeSheet(); return render(); }
  S.me = me; S.authErr = ''; S.newCred = null; S.upload = null; S.dist = null; S.actFilter = 'all'; S.tab = isAdmin() ? 'home' : 'today';
  S.f = {q:'', status:'all', sales:'all', special:''};
  S.unsub.push(store.onUsers(u => { S.users = u; render(); }));
  S.unsub.push(store.onLeads(list => {
    if(S.leadsLoaded && S.me.role === 'sales'){
      const known = new Set(S.leads.map(l => l.id));
      const fresh = list.filter(l => !known.has(l.id)).length;
      if(fresh) toast(`وصلك ${fresh} عميل جديد`);
    }
    S.leads = list; S.leadsLoaded = true; render();
  }));
  S.unsub.push(store.onActivities(a => { S.acts = a; if(S.tab === 'activity') render(); }));
  render();
}

  const app = $('#app');
  if(!S.me){ app.innerHTML = store.mode === 'demo' ? demoLoginView() : loginView(); return; }
  const keepScroll = window.scrollY;
  const q = document.activeElement && document.activeElement.id === 'q';
  app.innerHTML = headerView() + `<main>${mainView()}</main>` + navView();
  if(q){ const el = $('#q'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  window.scrollTo(0, keepScroll);
}

function navView(){
  const tabs = isAdmin()
    ? [['home','الرئيسية',ICON.home],['leads','العملاء',ICON.list],['upload','رفع شيت',ICON.upload],['team','الفريق',ICON.team],['activity','النشاط',ICON.act]]
    : [['today','النهارده',ICON.today],['leads','عملائي',ICON.list]];
  const badge = !isAdmin() ? S.leads.filter(l => isOverdue(l) || isDueToday(l)).length : 0;
  return `<nav class="nav">${tabs.map(([k, t, ic]) =>
    `<button class="${S.tab === k ? 'on' : ''}" onclick="App.go('${k}')">${ic}${t}${k === 'today' && badge ? `<span class="dot">${badge}</span>` : ''}</button>`).join('')}</nav>`;
}

function mainView(){
  if(!S.leadsLoaded) return `<div class="empty">بيحمّل...</div>`;
  switch(S.tab){
    case 'home': return adminHome();
    case 'leads': return leadsView();
    case 'upload': return uploadView();
    case 'team': return teamView();
    case 'activity': return activityView();
    case 'today': return todayView();
  }
  return '';
}

/* ---------------- الأدمن: الرئيسية ---------------- */
function callsByToday(){
  const t0 = startOfDay(), out = {};
  S.leads.forEach(l => (l.history || []).forEach(h => { if(h.at >= t0 && h.status !== 'assign') out[h.by] = (out[h.by] || 0) + 1; }));
  return out;
}
function adminHome(){
  const L = S.leads, t0 = startOfDay();
  const notCalled = L.filter(l => l.assignedTo && l.status === 'new').length;
  const today = L.filter(l => l.lastContactAt >= t0).length;
  const overdue = L.filter(isOverdue).length;
  const unassigned = L.filter(l => !l.assignedTo).length;
  const stale = L.filter(isStale).length;
  const calls = callsByToday();
  const team = activeSales().map(u => {
    const mine = L.filter(l => l.assignedTo === u.uid);
    return {u, total:mine.length, nc:mine.filter(l => l.status === 'new').length, calls:calls[u.uid] || 0,
      late:mine.filter(isOverdue).length, hot:mine.filter(l => l.status === 'interested').length,
      last:Math.max(0, ...mine.flatMap(l => (l.history || []).filter(h => uidsOf(u.uid).includes(h.by)).map(h => h.at)))};
  }).sort((a, b) => b.total - a.total);
  return `
    <h2>أهلاً يا ${esc(S.me.name.split(' ')[0])} 👋</h2>
    <div class="kpis">
      <button class="kpi" onclick="App.quick('')"><b>${L.length}</b><span>إجمالي العملاء</span></button>
      <button class="kpi today" onclick="App.quick('notcalled')"><b>${notCalled}</b><span>لسه محدش كلّمهم</span></button>
      <button class="kpi ok" onclick="App.quick('today')"><b>${today}</b><span>اتكلموا النهارده</span></button>
      <button class="kpi late" onclick="App.quick('overdue')"><b>${overdue}</b><span>متابعات متأخرة</span></button>
    </div>
    ${stale ? `<button class="alert" style="margin-top:12px" onclick="App.quick('stale')"><b>${stale}</b><div>عميل متوزع ومحدش كلّمه من أكتر من ${STALE_DAYS} يوم — دوس تشوفهم</div></button>` : ''}
    ${unassigned ? `<button class="alert" style="margin-top:10px;background:#EFF6FF;border-color:#BFDBFE;color:#1E3A8A" onclick="App.quick('unassigned')"><b>${unassigned}</b><div>عميل لسه مش متوزع على حد — دوس توزّعهم</div></button>` : ''}
    <h3>${isLeader() ? 'فريقك النهارده' : 'الفريق النهارده'}</h3>
    <div class="card" style="padding:4px 10px">
      <div class="team-row team-head"><div class="n">السيلز</div><div>عنده</div><div>ماكلّمش</div><div>كلّم النهارده</div><div>متأخر</div></div>
      ${team.length ? team.map(r => `<button class="team-row" onclick="App.bySales('${r.u.uid}')">
        <div class="n">${esc(r.u.name)}${r.u.role === 'leader' ? ' <span class="role-tag r-leader">تيم ليدر</span>' : ''}<small>${r.last ? 'آخر مكالمة ' + ago(r.last) : 'لسه مكلّمش حد'}</small></div>
        <div>${r.total}</div><div class="${r.nc ? 'c-late' : ''}">${r.nc}</div><div class="${r.calls ? 'c-ok' : ''}">${r.calls}</div><div class="${r.late ? 'c-late' : ''}">${r.late}</div>
      </button>`).join('') : `<div class="empty">مفيش سيلز لسه. ضيفهم من صفحة الفريق.</div>`}
    </div>`;
}

/* ---------------- قائمة العملاء ---------------- */
const SPECIALS = {notcalled:'لسه ماتكلموش', overdue:'متابعات متأخرة', today:'اتكلموا النهارده', stale:'متأخرين في التواصل', unassigned:'مش متوزعين', due:'متابعات النهارده'};
function filteredLeads(){
  const {q, status, sales, special} = S.f, t0 = startOfDay();
  const qq = q.trim().toLowerCase(), qd = normalizePhone(q);
  return S.leads.filter(l => {
    if(status !== 'all' && l.status !== status) return false;
    if(isAdmin() && sales !== 'all' && l.assignedTo !== sales) return false;
    if(special === 'notcalled' && !(l.assignedTo && l.status === 'new')) return false;
    if(special === 'overdue' && !isOverdue(l)) return false;
    if(special === 'today' && !(l.lastContactAt >= t0)) return false;
    if(special === 'stale' && !isStale(l)) return false;
    if(special === 'unassigned' && l.assignedTo) return false;
    if(special === 'due' && !isDueToday(l)) return false;
    if(qq){
      const hay = [l.name, l.project, l.unit, ...Object.values(l.extra || {})].join(' ').toLowerCase();
      if(!hay.includes(qq) && !(qd.length >= 3 && (l.phone || '').includes(qd))) return false;
    }
    return true;
  }).sort(byPriority);
}
function prio(l){ if(isOverdue(l)) return 0; if(isDueToday(l)) return 1; if(l.status === 'new') return 2; if(OPEN.has(l.status)) return 3; return 4; }
function byPriority(a, b){
  const d = prio(a) - prio(b); if(d) return d;
  if(a.nextFollowUp && b.nextFollowUp && prio(a) < 2) return a.nextFollowUp - b.nextFollowUp;
  return (b.lastContactAt || b.createdAt || 0) - (a.lastContactAt || a.createdAt || 0);
}
function leadItem(l){
  const st = STATUSES[l.status] || STATUSES.new;
  const due = l.nextFollowUp && OPEN.has(l.status) ? dueLabel(l.nextFollowUp) : null;
  const sub = [l.project, l.unit && ('وحدة ' + l.unit)].filter(Boolean).join(' · ');
  return `<button class="lead" onclick="App.open('${l.id}')">
    <div class="lead-top"><b>${esc(l.name || 'بدون اسم')}</b><span class="pill" style="--c:${st.color}">${st.label}</span></div>
    <div class="lead-sub">${esc(sub || l.phone)}</div>
    <div class="lead-meta">${isAdmin() ? `<span>${l.assignedTo ? 'مع ' + esc(userName(l.assignedTo)) : '<b style="color:var(--accent)">مش متوزع</b>'}</span>` : ''}
      <span>آخر تواصل: ${ago(l.lastContactAt)}</span>${due ? `<span class="due ${due.cls}">${due.txt}</span>` : ''}</div>
  </button>`;
}
function leadsView(){
  const counts = {}; S.leads.forEach(l => counts[l.status] = (counts[l.status] || 0) + 1);
  const chip = (k, label, n) => `<button class="chip ${S.f.status === k ? 'on' : ''}" onclick="App.status('${k}')">${label}${n != null ? `<i>${n}</i>` : ''}</button>`;
  return `
    <h2>${isBoss() ? 'كل العملاء' : isLeader() ? 'عملاء الفريق' : 'عملائي'}</h2>
    <input class="search" id="q" type="search" placeholder="دوّر بالاسم أو الرقم أو المشروع..." value="${esc(S.f.q)}" oninput="App.search(this.value)">
    ${isAdmin() ? `<select class="sel" onchange="App.sales(this.value)">
      <option value="all">كل السيلز</option>
      ${salesList().map(u => `<option value="${u.uid}" ${S.f.sales === u.uid ? 'selected' : ''}>${esc(u.name)}${u.active ? '' : ' (متوقف)'}</option>`).join('')}
    </select>` : ''}
    <div class="chips">${chip('all', 'الكل', S.leads.length)}${Object.entries(STATUSES).map(([k, v]) => chip(k, v.label, counts[k] || 0)).join('')}</div>
    ${S.f.special ? `<div class="chips"><button class="chip on" onclick="App.quick('', true)">${SPECIALS[S.f.special]} ✕</button></div>` : ''}
    ${S.f.special === 'unassigned' && isAdmin() && filteredLeads().length ? distributeUnassignedView() : ''}
    <div id="list">${listHTML()}</div>`;
}
function listHTML(){
  const list = filteredLeads();
  if(!list.length) return `<div class="empty">مفيش عملاء هنا</div>`;
  return `<div class="muted" style="font-size:12.5px;margin-top:4px">${list.length} عميل</div>`
    + list.slice(0, S.limit).map(leadItem).join('')
    + (list.length > S.limit ? `<button class="more" onclick="App.more()">اعرض أكتر (${list.length - S.limit})</button>` : '');
}

/* ---------------- السيلز: النهارده ---------------- */
function todayView(){
  const L = S.leads;
  const over = L.filter(isOverdue).sort((a, b) => a.nextFollowUp - b.nextFollowUp);
  const due = L.filter(isDueToday).sort((a, b) => a.nextFollowUp - b.nextFollowUp);
  const fresh = L.filter(l => l.status === 'new').sort((a, b) => (b.assignedAt || 0) - (a.assignedAt || 0));
  const calls = callsByToday()[S.me.uid] || 0;
  const sec = (title, list, empty) => `<h3>${title} (${list.length})</h3>` + (list.length ? list.slice(0, 50).map(leadItem).join('') : `<div class="card muted" style="text-align:center">${empty}</div>`);
  return `
    <h2>أهلاً يا ${esc(S.me.name.split(' ')[0])} 👋</h2>
    <div class="kpis">
      <div class="kpi late"><b>${over.length}</b><span>متابعات متأخرة</span></div>
      <div class="kpi today"><b>${due.length}</b><span>متابعات النهارده</span></div>
      <div class="kpi"><b>${fresh.length}</b><span>عملاء جداد مستنيين</span></div>

/* توزيع (مستخدم في رفع الشيت وتوزيع العملاء اللي مش متوزعين) */
function ensureDist(key, total){
  const holder = key === 'upload' ? S.upload : (S.dist = S.dist || {});
  if(!holder.dist){
    const sales = activeSales(); holder.dist = {};
    sales.forEach(u => holder.dist[u.uid] = 0);
    evenSplit(holder.dist, Object.keys(holder.dist), total);
  }
  // سيلز جداد اتضافوا
  activeSales().forEach(u => { if(!(u.uid in holder.dist)) holder.dist[u.uid] = null; });
  return holder.dist;
}
function evenSplit(dist, ids, total){
  Object.keys(dist).forEach(k => { if(dist[k] !== null) dist[k] = ids.includes(k) ? 0 : dist[k]; });
  if(!ids.length) return;
  const base = Math.floor(total / ids.length); let rest = total - base * ids.length;
  ids.forEach(k => { dist[k] = base + (rest-- > 0 ? 1 : 0); });
}
function distView(key, total){
  const dist = ensureDist(key, total);
  const sales = activeSales();
  if(!sales.length) return `<div class="card muted">مفيش سيلز متفعّلين. ضيفهم من صفحة الفريق الأول. (العملاء هيترفعوا من غير توزيع)</div>`;
  const sum = Object.values(dist).reduce((a, b) => a + (b || 0), 0);
  const left = total - sum;
  return `<div class="card">
    <div class="row" style="margin-bottom:6px"><button class="btn ghost" onclick="App.even('${key}', ${total})">وزّع بالتساوي على المختارين</button></div>
    ${sales.map(u => `<div class="dist-row">
      <label><input type="checkbox" ${dist[u.uid] !== null ? 'checked' : ''} onchange="App.distCheck('${key}', '${u.uid}', this.checked, ${total})">${esc(u.name)}</label>
      <input type="number" min="0" inputmode="numeric" value="${dist[u.uid] ?? 0}" ${dist[u.uid] === null ? 'disabled' : ''} onchange="App.distNum('${key}', '${u.uid}', this.value)">
    </div>`).join('')}
    <div class="sum"><span>المجموع: ${sum} من ${total}</span>
      <span class="${left < 0 ? 'bad' : ''}">${left > 0 ? `${left} هيفضلوا مش متوزعين` : left < 0 ? `زيادة ${-left} — قلّل الأرقام` : 'تمام ✓'}</span></div>
  </div>`;
}
function planAssign(n, dist){
  const q = Object.entries(dist).filter(([, c]) => c > 0).map(([u, c]) => ({u, c}));
  const out = []; let i = 0;
  while(out.length < n && q.some(x => x.c > 0)){ const x = q[i % q.length]; if(x.c > 0){ out.push(x.u); x.c--; } i++; }
  while(out.length < n) out.push(null);
  return out;
}

      <option value="all">كل الناس</option>${sales.map(u => `<option value="${u.uid}" ${S.actFilter === u.uid ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>
    <div class="card" style="padding:2px 14px">${list.length ? list.map(line).join('') : `<div class="empty">مفيش نشاط لسه</div>`}</div>`;
}

/* =====================================================================
   الأفعال
   ===================================================================== */
const App = window.App = {
  go(t){ S.tab = t; S.limit = 60; if(t === 'leads' && !S._keepFilter){ S.f = {q:'', status:'all', sales:'all', special:''}; } S._keepFilter = false; S.dist = null; render(); window.scrollTo(0, 0); },
  quick(special, stay){ S.f = {q:'', status:'all', sales:'all', special}; S.dist = null; S._keepFilter = true; if(stay) render(); else App.go('leads'); },
  bySales(uid){ S.f = {q:'', status:'all', sales:uid, special:''}; S._keepFilter = true; App.go('leads'); },
  search(v){ S.f.q = v; S.limit = 60; const el = $('#list'); if(el) el.innerHTML = listHTML(); },
  status(k){ S.f.status = k; S.limit = 60; render(); },
  sales(v){ S.f.sales = v; render(); },
  more(){ S.limit += 100; render(); },
  actFilter(v){ S.actFilter = v; render(); },

  async login(e){
    e.preventDefault(); const b = $('#lgBtn'); b.disabled = true; b.textContent = 'بيدخل...';
    try{ await store.signIn($('#lg').value, $('#pw').value); }
    catch(err){ S.authErr = fbError(err); render(); }
  },
  toggleReg(){ S.regMode = !S.regMode; S.authErr = ''; render(); },
  async register(e){
    e.preventDefault();
    if($('#p1').value !== $('#p2').value){ S.authErr = 'كلمتين السر مش زي بعض'; return render(); }
    try{ await store.registerAdmin($('#p1').value); S.regMode = false; }
    catch(err){ S.authErr = /email-already-in-use/.test(err.code || '') ? 'حساب الأدمن متعمل قبل كده — ارجع وسجّل دخول' : fbError(err); render(); }
  },
  demoLogin(id){ store.demoLogin(id); },
  resetDemo(){ store.resetDemo(); toast('رجعت البيانات التجريبية'); render(); },
  logout(){ store.signOut(); },

  open(id){ const l = leadById(id); if(!l) return toast('العميل ده مش متاح'); recCleanup(); S.openId = id; openSheet(leadSheet(l)); },
  async recStart(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return toast('الجهاز أو المتصفح ده مش بيدعم تسجيل الصوت');
    if(S.dic) App.dictate();
    let stream;
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ return toast('لازم تسمح للميكروفون عشان تسجّل فويس'); }
    const mime = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/webm'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    let mr;
    try{ mr = new MediaRecorder(stream, mime ? {mimeType:mime, audioBitsPerSecond:24000} : {audioBitsPerSecond:24000}); }
    catch(e){ mr = new MediaRecorder(stream); }
    const chunks = [], rec = {mr, stream, start:Date.now(), recording:true};
    mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      clearInterval(rec.timer); stream.getTracks().forEach(t => t.stop());
      if(rec.discard || S.rec !== rec) return;
      const type = (mr.mimeType || mime || 'audio/webm').split(';')[0];
      rec.blob = new Blob(chunks, {type}); rec.mime = type; rec.recording = false;
      rec.dur = Math.max(1, Math.round((Date.now() - rec.start) / 1000));
      rec.url = URL.createObjectURL(rec.blob);
      if(rec.blob.size > 4.5e6){ toast('الفويس كبير قوي، سجّل أقصر'); App.recClear(); return; }
      renderRec();
    };
    rec.timer = setInterval(() => {
      const sec = Math.round((Date.now() - rec.start) / 1000), t = $('#recTime'); if(t) t.textContent = mmss(sec);
      if(sec >= MAX_REC_SEC){ toast('وصلت لأقصى مدة (3 دقايق)'); App.recStop(); }
    }, 500);
    S.rec = rec; mr.start(1000); renderRec();
  },
  recStop(){ const r = S.rec; if(r && r.mr && r.mr.state === 'recording') r.mr.stop(); },
  recClear(){ const r = S.rec; if(r && r.url) URL.revokeObjectURL(r.url); S.rec = null; renderRec(); },
  dictate(){
    if(!SpeechRec) return;
    if(S.dic){ try{ S.dic.stop(); }catch(e){} S.dic = null; const d = $('#dicBtn'); if(d){ d.classList.remove('listening'); d.textContent = 'اتكلم ويتكتب لوحده'; } return; }
    const r = new SpeechRec(); r.lang = 'ar-EG'; r.continuous = true; r.interimResults = false;
    r.onresult = e => { const ta = $('#note'); if(!ta) return; for(let i = e.resultIndex; i < e.results.length; i++) if(e.results[i].isFinal) ta.value = (ta.value ? ta.value.trim() + ' ' : '') + e.results[i][0].transcript.trim(); };
    r.onerror = e => { if(e.error === 'not-allowed') toast('لازم تسمح للميكروفون'); };
    r.onend = () => { if(S.dic === r){ S.dic = null; const d = $('#dicBtn'); if(d){ d.classList.remove('listening'); d.textContent = 'اتكلم ويتكتب لوحده'; } } };
    try{ r.start(); }catch(e){ return toast('مش قادر أشغّل الكتابة بالصوت'); }
    S.dic = r; const d = $('#dicBtn'); if(d){ d.classList.add('listening'); d.textContent = '● بيسمعك... دوس عشان توقف'; }
  },
  async play(btn, id, n, mime){
    const box = btn.parentElement; btn.disabled = true; btn.textContent = 'بيحمّل...';
    try{
      const b64 = await store.loadVoice(id, n);
      if(!b64) throw {message:'الفويس مش موجود'};
      const url = URL.createObjectURL(b64ToBlob(b64, mime));
      box.innerHTML = `<audio controls autoplay src="${url}"></audio>`;
    }catch(e){ btn.disabled = false; btn.textContent = '▶ اسمع الفويس'; toast(fbError(e)); }
  },
  close(){ closeSheet(); },
  stChange(){
    const v = (document.querySelector('input[name=st]:checked') || {}).value;
    const box = $('#fuBox'); box.classList.toggle('hidden', !OPEN.has(v));
    $('#fuReq').textContent = v === 'followup' ? '(لازم)' : '(اختياري)';
    if(v === 'noanswer' && !$('#fuIn').value) App.fu(3);
    if(v === 'followup' && !$('#fuIn').value) App.fu('tom');
  },
  fu(h){
    let t;
    if(h === 'tom'){ const d = new Date(startOfDay() + DAY); d.setHours(12); t = d.getTime(); }
    else t = Date.now() + h * 36e5;
    $('#fuIn').value = toLocalInput(t);
  },
  async save(){
    const l = leadById(S.openId); if(!l) return;
    const status = (document.querySelector('input[name=st]:checked') || {}).value;
    const note = $('#note').value.trim();
    let fu = $('#fuIn').value ? new Date($('#fuIn').value).getTime() : null;
    if(!status) return toast('اختار نتيجة المكالمة الأول');
    if(status === 'followup' && !fu) return toast('حدد ميعاد المتابعة');
    if(!OPEN.has(status)) fu = null;
    if(S.rec && S.rec.recording) return toast('وقّف تسجيل الفويس الأول');
    const b = $('#saveBtn'); b.disabled = true; b.textContent = 'بيحفظ...';
    const now = Date.now();
    const hist = {at:now, by:S.me.uid, byName:S.me.name, status, note, nextFollowUp:fu};
    try{
      if(S.rec && S.rec.blob){
        b.textContent = 'بيرفع الفويس...';
        const b64 = await blobToB64(S.rec.blob);
        const v = await store.saveVoice(b64, {by:S.me.uid, leadId:l.id, at:now, mime:S.rec.mime, dur:S.rec.dur});
        hist.voice = {id:v.id, n:v.n, dur:S.rec.dur, mime:S.rec.mime};
      }
      await store.updateLeads([l.id], {status, lastContactAt:now, nextFollowUp:fu, callCount:(l.callCount || 0) + 1}, hist);
      await store.addActivity({type:'call', at:now, by:S.me.uid, byName:S.me.name, leadId:l.id, leadName:l.name || '', status, note, voice:hist.voice || null, assignedTo:l.assignedTo || null, teamId:l.teamId || null});
      closeSheet(); toast('اتسجّلت ✓');
    }catch(e){ toast(fbError(e)); b.disabled = false; b.textContent = 'حفظ'; }
  },
  async reassign(){
    const l = leadById(S.openId); const to = $('#reas').value || null;
    if((l.assignedTo || null) === to) return toast('العميل أصلاً مع نفس الشخص');
    const now = Date.now(), note = `${S.me.name} حوّل ${l.name || 'عميل'} ${l.assignedTo ? 'من ' + userName(l.assignedTo) + ' ' : ''}لـ ${userName(to)}`;
    try{
      await store.updateLeads([l.id], {assignedTo:to, assignedAt:to ? now : null, teamId:teamOf(to)}, {at:now, by:S.me.uid, byName:S.me.name, status:'assign', note});
      await store.addActivity({type:'assign', at:now, by:S.me.uid, byName:S.me.name, leadId:l.id, leadName:l.name || '', note, teamId:teamOf(to) || myTeam()});
      closeSheet(); toast('اتحوّل ✓');
    }catch(e){ toast(fbError(e)); }
  },
  async del(){
    const b = $('#delBtn');
    if(!b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'متأكد؟ دوس تاني للمسح'; return; }
    try{ await store.deleteLeads([S.openId]); closeSheet(); toast('اتمسح'); }catch(e){ toast(fbError(e)); }
  },

  file(f){
    if(!f) return;
    if(typeof XLSX === 'undefined') return toast('مكتبة الإكسل لسه بتحمّل، جرّب كمان ثانية');
    const r = new FileReader();
    r.onload = ev => {
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false, blankrows:false});
        const hi = rows.findIndex(r => r.filter(c => String(c).trim()).length >= 2);
        if(hi < 0) return toast('الشيت فاضي أو مش مفهوم');
        const headers = rows[hi].map(c => String(c).trim());
        const body = rows.slice(hi + 1).filter(r => r.some(c => String(c).trim()));
        S.upload = {fileName:f.name, headers, rows:body, map:guessMap(headers), dist:null};
        render();
      }catch(e){ toast('مش قادر أقرا الملف ده'); }
    };
    r.readAsArrayBuffer(f);
  },
  map(f, v){ S.upload.map[f] = +v; S.upload.dist = null; render(); },
  cancelUpload(){ S.upload = null; render(); },
  even(key, total){
    const holder = key === 'upload' ? S.upload : S.dist;
    const ids = Object.keys(holder.dist).filter(k => holder.dist[k] !== null);
    evenSplit(holder.dist, ids, total); render();
  },
  distCheck(key, uid, on, total){
    const holder = key === 'upload' ? S.upload : S.dist;
    holder.dist[uid] = on ? 0 : null;
    const ids = Object.keys(holder.dist).filter(k => holder.dist[k] !== null);
    evenSplit(holder.dist, ids, total); render();
  },
  distNum(key, uid, v){ const holder = key === 'upload' ? S.upload : S.dist; holder.dist[uid] = Math.max(0, parseInt(v) || 0); render(); },
  async doUpload(){
    const {ok} = prepareRows(); const dist = S.upload.dist || {};
    const sum = Object.values(dist).reduce((a, b) => a + (b || 0), 0);
    if(sum > ok.length) return toast('مجموع التوزيع أكبر من عدد العملاء');
    const b = $('#upBtn'); b.disabled = true; b.textContent = 'بيرفع...';
    const plan = planAssign(ok.length, dist), now = Date.now(), file = S.upload.fileName;
    const leads = ok.map((r, i) => ({...r, status:'new', assignedTo:plan[i], teamId:teamOf(plan[i]), assignedAt:plan[i] ? now : null, createdAt:now,
      lastContactAt:null, nextFollowUp:null, callCount:0, history:[], source:file}));
    try{
      await store.addLeads(leads);
      const per = {}; plan.forEach(u => { if(u) per[u] = (per[u] || 0) + 1; });
      const parts = Object.entries(per).map(([u, n]) => `${userName(u)} ${n}`).join('، ');
      await store.addActivity({type:'upload', at:now, by:S.me.uid, byName:S.me.name, note:`رفع ${leads.length} عميل من ${file}${parts ? ' — ' + parts : ''}`, teamId:myTeam()});
      S.upload = null; toast(`اترفع ${leads.length} عميل واتوزعوا ✓`); App.go('home');
    }catch(e){ toast(fbError(e)); b.disabled = false; b.textContent = 'ارفع ووزّع'; }
  },
  async doDistribute(){
    const list = filteredLeads(); const dist = S.dist && S.dist.dist || {};
    const sum = Object.values(dist).reduce((a, b) => a + (b || 0), 0);
    if(!sum) return toast('حدد أعداد التوزيع');
    if(sum > list.length) return toast('مجموع التوزيع أكبر من عدد العملاء');
    const b = $('#unBtn'); b.disabled = true; b.textContent = 'بيوزّع...';
    const plan = planAssign(list.length, dist), now = Date.now(), groups = {};
    plan.forEach((u, i) => { if(u) (groups[u] = groups[u] || []).push(list[i].id); });
    try{
      for(const [u, ids] of Object.entries(groups)){
        await store.updateLeads(ids, {assignedTo:u, assignedAt:now, teamId:teamOf(u)}, {at:now, by:S.me.uid, byName:S.me.name, status:'assign', note:`اتوزع على ${userName(u)}`});
      }
      await store.addActivity({type:'assign', at:now, by:S.me.uid, byName:S.me.name, note:`${S.me.name} وزّع ${sum} عميل: ` + Object.entries(groups).map(([u, ids]) => `${userName(u)} ${ids.length}`).join('، '), teamId:myTeam()});
      S.dist = null; toast('اتوزعوا ✓'); render();
    }catch(e){ toast(fbError(e)); b.disabled = false; b.textContent = 'وزّع'; }
  },

  async addSales(e){
    e.preventDefault();
    const name = $('#sn').value.trim(), login = $('#sl').value.trim().toLowerCase(), pw = $('#sp').value;
    const role = isBoss() ? $('#sr').value : 'sales';
    const leaderId = isBoss() ? (role === 'sales' ? ($('#sld').value || null) : null) : S.me.uid;
    const b = $('#addBtn'); b.disabled = true; b.textContent = 'بيضيف...';
    try{ await store.createSales({name, login, password:pw, role, leaderId}); S.newCred = {name, login, pw}; render(); }
    catch(err){ toast(fbError(err)); b.disabled = false; b.textContent = 'إضافة'; }
  },
  newRoleChange(){ const w = $('#slWrap'); if(w) w.classList.toggle('hidden', $('#sr').value !== 'sales'); },
  async setRole(uid, role){
    const u = S.users[uid]; if(!u || u.role === role) return;
    if(role === 'manager' && !isOwner()) return toast('الأدمن بس اللي يعيّن مدير مبيعات');
    try{
      await store.updateUser(uid, {role, leaderId:null});
      if(u.role === 'leader'){ // فريقه بيبقى من غير تيم ليدر
        for(const m of Object.values(S.users).filter(x => x.leaderId === uid)) await store.updateUser(m.uid, {leaderId:null});
        const ids = S.leads.filter(l => l.teamId === uid && l.assignedTo !== uid).map(l => l.id);
        if(ids.length) await store.updateLeads(ids, {teamId:null});
      }
      const own = S.leads.filter(l => l.assignedTo === uid).map(l => l.id);
      if(own.length) await store.updateLeads(own, {teamId: role === 'leader' ? uid : null});
      await store.addActivity({type:'assign', at:Date.now(), by:S.me.uid, byName:S.me.name, note:`${S.me.name} خلّى ${u.name} ${ROLE_LABEL[role]}`});
      toast(`${u.name} بقى ${ROLE_LABEL[role]} ✓`);
    }catch(e){ toast(fbError(e)); render(); }
  },
  async setLeader(uid, leaderId){
    const u = S.users[uid]; leaderId = leaderId || null;
    try{
      await store.updateUser(uid, {leaderId});
      const own = S.leads.filter(l => l.assignedTo === uid).map(l => l.id);
      if(own.length) await store.updateLeads(own, {teamId:leaderId});
      toast(leaderId ? `${u.name} بقى في فريق ${userName(leaderId)} ✓` : `${u.name} بقى من غير تيم ليدر`);
    }catch(e){ toast(fbError(e)); render(); }
  },
  copyCred(){
    const c = S.newCred; const txt = `أهلاً ${c.name}، دي بيانات دخولك على Blue:\nاسم الدخول: ${c.login}\nكلمة السر: ${c.pw}\nاللينك: ${location.href.split('#')[0]}`;
    navigator.clipboard.writeText(txt).then(() => toast('اتنسخت ✓'), () => toast('مقدرتش أنسخ، انسخها بإيدك'));
  },
  pwSheet(uid){
    const u = S.users[uid]; if(!u) return;
    openSheet(`<div class="sheet-h"><h2>كلمة سر جديدة</h2><button class="x" onclick="App.close()">×</button></div>
      <p class="muted">لـ <b>${esc(u.name)}</b> — اسم الدخول هيفضل زي ما هو: <code dir="ltr">${esc(u.login)}</code><br>كلمة السر القديمة هتبطّل تشتغل، وكل عملاؤه وتاريخهم هيفضلوا معاه.</p>
      <div class="card"><label class="f">كلمة السر الجديدة</label>
        <input class="in" id="npw" dir="ltr" minlength="6" placeholder="6 حروف أو أرقام على الأقل">
        <button class="btn block" style="margin-top:12px" id="npwBtn" onclick="App.resetPw('${uid}')">غيّر كلمة السر</button></div>`);
    setTimeout(() => { const el = $('#npw'); if(el) el.focus(); }, 50);
  },
  async resetPw(uid){
    const u = S.users[uid], pw = $('#npw').value.trim();
    if(pw.length < 6) return toast('كلمة السر لازم 6 حروف أو أرقام على الأقل');
    const b = $('#npwBtn'); b.disabled = true; b.textContent = 'بيغيّر...';
    try{
      await store.resetSales(u, pw);
      closeSheet(); S.newCred = {name:u.name, login:u.login, pw, reset:true};
      await store.addActivity({type:'assign', at:Date.now(), by:S.me.uid, byName:S.me.name, note:`${S.me.name} غيّر كلمة سر ${u.name}`});
      render(); window.scrollTo(0, 0); toast('اتغيرت ✓');
    }catch(e){ toast(fbError(e)); b.disabled = false; b.textContent = 'غيّر كلمة السر'; }
  },
  async toggleUser(uid, on){ try{ await store.updateUser(uid, {active:on}); toast(on ? 'الحساب اتفعّل' : 'الحساب اتقفل'); }catch(e){ toast(fbError(e)); render(); } }
};

// تحديث "من كام دقيقة" والمتأخرين كل دقيقة
setInterval(() => { if(S.me && !document.activeElement.matches('input,textarea,select')) render(); }, 60000);
