      await store.setLayout(key, {...L, photos:(L.photos || []).filter(x => x !== pid), at:Date.now()});
      if(store.deleteLayoutPhoto) await store.deleteLayoutPhoto(pid);
      App.closeLb(); toast('اتمسحت'); if(S.openUnitId) setTimeout(() => App.openUnit(S.openUnitId), 150);
    }catch(e){ toast(fbError(e)); }
  },
  vwSheet(id){
    const l = leadById(id); if(!l) return;
    const guess = [l.project, l.unit].filter(Boolean).join(' – ');
    openSheet(`<div class="sheet-h"><h2>🚶 معاينة مع ${esc(l.name || 'العميل')}</h2><button class="x" onclick="App.close()">×</button></div>
      <p class="muted">أول ما تبدأ، مكانك هيتبعت لمديرك كل دقيقة طول ما الأبليكيشن مفتوح، ولما تخلص دوس "خلصت المعاينة".</p>
      <div class="card"><label class="f">الوحدة / المشروع (اختياري)</label>
        <input class="in" id="vwUnit" list="vwUnits" value="${esc(guess)}" placeholder="مثلاً: Allegria – فيلا B12">
        <datalist id="vwUnits">${[...new Set(S.units.map(u => [u.project, u.unitNo].filter(Boolean).join(' – ')).filter(Boolean))].slice(0, 400).map(t => `<option value="${esc(t)}">`).join('')}</datalist>
        <button class="btn block" style="margin-top:12px;background:#16A34A" id="vwGo" onclick="App.vwStart('${id}')">ابدأ المعاينة</button></div>`);
  },
  async vwStart(id){
    const l = leadById(id); if(!l) return;
    if(myViewing()) return toast('انت أصلاً في معاينة — خلّصها الأول');
    const b = $('#vwGo'); b.disabled = true; b.textContent = 'بيحدد مكانك...';
    let pos = null;
    try{ pos = await getPosition(); }catch(e){ toast(e.message + ' — المعاينة هتبدأ من غير مكان'); }
    const now = Date.now(), unit = ($('#vwUnit') || {}).value ? $('#vwUnit').value.trim() : '';
    const v = {active:true, start:now, at:pos ? now : null, unit, by:S.me.uid, byName:S.me.name, ...(pos || {})};
    try{
      await store.updateLeads([id], {viewing:v});
      await store.addActivity({type:'viewing', at:now, by:S.me.uid, byName:S.me.name, leadId:id, leadName:l.name || '', note:`${S.me.name} طلع معاينة مع ${l.name || 'عميل'}${unit ? ' — ' + unit : ''}`, teamId:l.teamId || myTeam(), ...(pos ? {lat:pos.lat, lng:pos.lng} : {})});
      l.viewing = v; vwTrack(id); scoreBump('v');
      closeSheet(); toast('بدأت المعاينة ✓'); render();
      setTimeout(() => App.vwWhats(id), 250);
    }catch(e){ toast(fbError(e)); b.disabled = false; b.textContent = 'ابدأ المعاينة'; }
  },
  vwWhats(id){
    const l = leadById(id); if(!l) return;
    const m = vwManager(), v = l.viewing || {};
    const msg = `📍 أنا طالع معاينة دلوقتي\nالعميل: ${l.name || '—'}${v.unit ? '\nالوحدة: ' + v.unit : ''}${v.lat ? '\nمكاني: ' + mapsUrl(v) : ''}\nهبعتلك اللوكيشن اللايف دلوقتي.`;
    openSheet(`<div class="sheet-h"><h2>ابعت لمديرك على واتساب</h2><button class="x" onclick="App.close()">×</button></div>
      ${m ? `<p class="muted">هيفتحلك محادثة <b>${esc(m.name)}</b> وفيها رسالة جاهزة. ابعتها، وبعدين:</p>
        <div class="card" style="line-height:2">1. دوس على 📎 (أو ＋ على الآيفون)<br>2. اختار <b>Location / الموقع</b><br>3. اختار <b>Share live location / مشاركة الموقع المباشر</b> وحدد المدة</div>
        <a class="btn block" style="margin-top:12px;background:#25D366" href="https://wa.me/${waNum(m.phone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">افتح واتساب ${esc(m.name)}</a>`
      : `<div class="err">مفيش رقم موبايل متسجل لمديرك في صفحة الفريق — اطلب من الأدمن يضيفه. مكانك لسه بيتبعت جوه الأبليكيشن عادي.</div>`}
      <button class="btn ghost block" style="margin-top:8px" onclick="App.close()">بعدين</button>`);
  },
  async vwEnd(id){
    const l = leadById(id), b = $('#vwEndBtn'); if(!l || !l.viewing) return;
    if(b && !b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'متأكد؟ دوس تاني'; return; }
    const now = Date.now(), v = {...l.viewing, active:false, end:now};
    const mins = Math.max(1, Math.round((now - v.start) / 60000));
    try{
      await store.updateLeads([id], {viewing:v}); vwStop();
      await store.addActivity({type:'viewing', at:now, by:S.me.uid, byName:S.me.name, leadId:id, leadName:l.name || '', note:`${S.me.name} خلّص معاينة مع ${l.name || 'عميل'} (${mins} دقيقة)${v.unit ? ' — ' + v.unit : ''}`, teamId:l.teamId || myTeam()});
      closeSheet(); toast('اتسجلت المعاينة ✓ — متنساش تكتب حصل إيه مع العميل'); render();
      setTimeout(() => App.open(id), 300);
    }catch(e){ toast(fbError(e)); }
  },
  aliasSheet(id){
    const u = unitById(id); if(!u || !canLayout()) return;
    const from = projCanon(u.project), cur = projKey(u.project);
    const seen = {};
    S.units.forEach(x => { const k = projKey(x.project); if(!k || k === cur) return; (seen[k] = seen[k] || {name:x.project, n:0}).n++; });
    Object.entries(S.layouts).forEach(([k, L]) => { if(k !== cur && L.photos && L.photos.length) (seen[k] = seen[k] || {name:L.name, n:0}).ly = true; });
    const list = Object.entries(seen).sort((a, b) => (!!b[1].ly - !!a[1].ly) || b[1].n - a[1].n);
    openSheet(`<div class="sheet-h"><h2>🔗 نفس المشروع</h2><button class="x" onclick="App.close()">×</button></div>
      <p class="muted">لو <b>${esc(u.project)}</b> هو نفسه مشروع مكتوب باسم تاني (عربي أو إنجليزي أو بهجاء مختلف)، اختاره هنا، واللي أوت هيظهر للاتنين.</p>
      ${from !== cur ? `<div class="card" style="display:flex;align-items:center;gap:8px"><div style="flex:1">مربوط دلوقتي بـ <b>${esc((S.layouts[cur] && S.layouts[cur].name) || (seen[cur] && seen[cur].name) || cur)}</b></div>
        <button class="btn danger mini" onclick="App.setAlias('${from}', '')">فك الربط</button></div>` : ''}
      <input class="in" placeholder="دوّر على المشروع..." oninput="const q=this.value.toLowerCase();document.querySelectorAll('.al-it').forEach(e=>e.classList.toggle('hidden',!e.dataset.n.includes(q)))">
      <div class="card" style="padding:2px 12px;margin-top:8px;max-height:52vh;overflow:auto">
      ${list.map(([k, v]) => `<button class="user-pick al-it" data-n="${esc(String(v.name || '').toLowerCase())}" onclick="App.setAlias('${from}', '${k}')"><b>${esc(v.name || k)}</b><small>${v.n ? v.n + ' وحدة' : ''}${v.ly ? ' · فيه لي أوت 🗺️' : ''}</small></button>`).join('') || '<div class="empty">مفيش مشاريع تانية</div>'}
      </div>`);
  },
  async setAlias(from, to){
    if(!canLayout()) return;
    if(to && projKey(to) === from) return toast('ده هيعمل لفة — اختار مشروع تاني');
    try{ await store.setAlias(from, to || null); S.aliases[from] = to || undefined; if(!to) delete S.aliases[from]; closeSheet(); toast(to ? 'اتربطوا ✓ — بقوا مشروع واحد' : 'اتفك الربط'); if(S._lastUnit) setTimeout(() => App.openUnit(S._lastUnit), 150); }
    catch(e){ toast(fbError(e)); }
  },
  async pickAvatar(f){
    const box = $('#avPrev');
    if(!f){ S._avatar = ''; if(box) box.innerHTML = '<span class="muted" style="font-size:12px">هتتشال بعد الحفظ</span>'; return; }
    try{ S._avatar = await processAvatar(f); if(box) box.innerHTML = `<img src="${S._avatar}" alt="" style="width:76px;height:76px;border-radius:50%;object-fit:cover">`; }
    catch(e){ toast('مقدرتش أقرا الصورة دي'); }
  },
  // بيزامن أسماء وأرقام الفريق في ملف واحد يقدر يشوفه كل السيلز (للإعلانات وزرار المعاينة)
  async syncStaff(){
    if(!isBoss() || S._staffSync) return; S._staffSync = true;
    try{
      for(const u of Object.values(S.users)){
        if(u.replacedBy) continue;
        const m = S.staff[u.uid] || {};
        if((m.name || '') !== (u.name || '') || (m.phone || '') !== (u.phone || '') || (m.role || '') !== (u.role || '') || (m.leaderId || null) !== (u.leaderId || null))
          await store.setStaff(u.uid, {name:u.name || '', phone:u.phone || '', role:u.role || '', leaderId:u.leaderId || null});
      }
    }catch(e){}
    setTimeout(() => { S._staffSync = false; }, 30000);
  },
  /* رقم الموبايل */
  phoneSheet(uid){
    const u = S.users[uid] || (uid === S.me.uid ? S.me : null); if(!u) return;
    S._avatar = undefined;
    const ph = staffInfo(uid).photo;
    openSheet(`<div class="sheet-h"><h2>الاسم والموبايل والصورة</h2><button class="x" onclick="App.close()">×</button></div>
      <p class="muted">لـ <b>${esc(u.name)}</b> — الرقم والصورة بيظهروا في إعلانات الوحدات بتاعته، والرقم بيستخدمه فريقه في زرار المعاينة.</p>
      <div class="card" style="display:flex;align-items:center;gap:12px">
        <div id="avPrev">${ph ? `<img src="${ph}" alt="" style="width:76px;height:76px;border-radius:50%;object-fit:cover">` : avatarHtml(uid, 76)}</div>
        <div style="flex:1"><label class="btn ghost mini">${ph ? 'غيّر الصورة' : '＋ اختار صورة'}<input type="file" accept="image/*" class="hidden" onchange="App.pickAvatar(this.files[0])"></label>
          ${ph ? `<button type="button" class="btn ghost mini" style="margin-inline-start:6px" onclick="App.pickAvatar(null)">شيل الصورة</button>` : ''}
          <div class="muted" style="font-size:12px;margin-top:6px">صورة واضحة للوش — بتتقص مربع لوحدها</div></div>
      </div>
      <div class="card" style="margin-top:10px"><label class="f" style="margin-top:0">الاسم</label>
        <input class="in" id="uname" value="${esc(u.name || '')}" placeholder="الاسم اللي بيظهر في الأبليكيشن والإعلانات">
        <label class="f">الموبايل</label>
        <input class="in" id="uphone" dir="ltr" inputmode="tel" placeholder="010..." value="${esc(u.phone || '')}">
        <button class="btn block" style="margin-top:12px" id="uphBtn" onclick="App.savePhone('${uid}')">حفظ</button></div>`);
    setTimeout(() => { const el = $('#uphone'); if(el) el.focus(); }, 50);
  },
  async savePhone(uid){
    const ph = $('#uphone').value.trim();
    if(ph && ph.replace(/\D/g, '').length < 8) return toast('الرقم ده قصير — اتأكد منه');
    const b = $('#uphBtn'); b.disabled = true; b.textContent = 'بيحفظ...';
    const nm = ($('#uname') || {}).value ? $('#uname').value.trim() : '';
    if(!nm) return toast('اكتب الاسم');
    try{
      const prev = S.users[uid] || S.me, renamed = nm !== (prev.name || '');
      await store.updateUser(uid, renamed ? {phone:ph, name:nm} : {phone:ph});
      if(uid === S.me.uid){ S.me.phone = ph; S.me.name = nm; }
      if(renamed){ const ids = {}; S.units.filter(x => x.agentId === uid).forEach(x => (ids[x.page] = ids[x.page] || []).push(x.id)); if(Object.keys(ids).length) await store.renameAgent(ids, nm); }
      const u = {...prev, name:nm}, entry = {name:nm, phone:ph, role:u.role || '', leaderId:u.leaderId || null};
      if(S._avatar !== undefined) entry.photo = S._avatar || '';
      await store.setStaff(uid, entry);
      closeSheet(); toast('اتحفظ ✓'); render();
    }
    catch(e){ toast(fbError(e)); b.disabled = false; b.textContent = 'حفظ'; }
  },
  async shareUnitText(id){
    const u = unitById(id); if(!u) return;
    const text = unitShareText(u);
    try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
    App.copyText(text);
  },
  copyText(t){ try{ navigator.clipboard.writeText(t).then(() => toast('اتنسخ ✓'), () => toast('مقدرتش أنسخ')); }catch(e){ toast('مقدرتش أنسخ'); } },

  /* رفع شيت الإنفنتوري */
  invFile(f){
    if(!f) return;
    if(typeof XLSX === 'undefined') return toast('مكتبة الإكسل لسه بتحمّل، جرّب كمان ثانية');
    const r = new FileReader();
    r.onload = ev => {
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false, blankrows:false});
        const hi = rows.findIndex(r => r.filter(c => String(c).trim()).length >= 3);
        if(hi < 0) return toast('الشيت فاضي أو مش مفهوم');
        const headers = rows[hi].map(c => String(c).trim());
        S.inv = {fileName:f.name, headers, rows:rows.slice(hi + 1), map:invMap(headers), agentMap:null};
        render(); window.scrollTo(0, 0);
      }catch(e){
        toast(/password|encrypt/i.test(String(e && e.message)) ? 'الشيت عليه باسورد — شيل الباسورد الأول من الإكسل وارفعه تاني' : 'مش قادر أقرا الملف ده');
      }
    };
    r.readAsArrayBuffer(f);
  },
  invCancel(){ S.inv = null; render(); },
  invAgent(i, uid){ const P = invPrepare(); const a = Object.entries(P.agents).sort((x, y) => y[1] - x[1])[i]; if(a) S.inv.agentMap[a[0]] = uid || ''; render(); },
  async dedupUnits(){
    if(!isBoss()) return;
    const b = $('#dedupBtn'), g = dupGroups();
    if(!b.dataset.sure){ b.dataset.sure = 1; b.textContent = `متأكد؟ هيتمسح ${g.reduce((n, a) => n + a.length - 1, 0)} نسخة مكررة — دوس تاني`; return; }
    b.disabled = true; let done = 0, kept = 0;
    for(const arr of g){
      const sorted = [...arr].sort((x, y) => unitScore(y) - unitScore(x) || (x.createdAt || 0) - (y.createdAt || 0));
      for(const u of sorted.slice(1)){
        if((u.photos || []).length && (sorted[0].photos || []).length && u.photos.join() !== sorted[0].photos.join()){ kept++; continue; }   // نسخة فيها صور مختلفة: مش بنمسحها
        try{ await store.deleteUnit(u.page, u.id, u.photos || []); done++; b.textContent = `بيمسح... ${done}`; }catch(e){}
      }
    }
    await store.addActivity({type:'upload', at:Date.now(), by:S.me.uid, byName:S.me.name, note:`🧹 تنظيف الوحدات المكررة: اتمسح ${done} نسخة`, teamId:null}).catch(() => {});
    toast(`اتمسح ${done} نسخة مكررة ✓${kept ? ` — وفضل ${kept} فيهم صور مختلفة، راجعهم بإيدك` : ''}`); render();
  },
  async invDo(){
    const P = invPrepare(), now = Date.now(), b = $('#invBtn');
    if(S._invBusy) return; S._invBusy = true; setTimeout(() => { S._invBusy = false; }, 15000);
    b.disabled = true;
    const units = [], owners = [];
    P.units.forEach((x, i) => {
      const id = newUid() + i.toString(36);
      const agentId = S.inv.agentMap[x.agentRaw] || null;
      const au = agentId ? S.users[agentId] : null;
      const teamId = agentId ? teamOf(agentId) : null;
      const {_owner, agentRaw, ...rest} = x;
      units.push({...rest, id, code:rest.code || ('BL-' + (now + i).toString(36).toUpperCase().slice(-6)), agentId, agentName:au ? au.name : agentRaw, teamId,
        ownerKey:ownerKeyOf(_owner.ownerPhone) || ownerKeyOf(_owner.otherPhone), ownerNameKey:ownerNameKeyOf(_owner.ownerName),
        status:'available', availableFrom:null, photos:[], notes:'', createdAt:now, createdBy:S.me.uid, src:S.inv.fileName});
      owners.push({id, data:{..._owner, agentId, teamId, unitId:id}});
    });
    try{
      await store.importUnits(units, owners, (n, t) => { b.textContent = `بيرفع... ${n} من ${t}`; });
      await store.addActivity({type:'upload', at:Date.now(), by:S.me.uid, byName:S.me.name, note:`رفع ${units.length} وحدة للإنفنتوري من ${S.inv.fileName}`, teamId:null});
      S.inv = null; toast(`اترفع ${units.length} وحدة ✓`); render();
    }catch(e){ toast(fbError(e)); b.disabled = false; b.textContent = 'ارفع تاني'; }
  }
});

// تحديث "من كام دقيقة" والمتأخرين كل دقيقة
setInterval(() => { if(S.me && !document.activeElement.matches('input,textarea,select') && $('#sheet').classList.contains('hidden')) render(); }, 60000);
// صوت لما يظهر تأخير جديد (عميل عدّى عليه وقت الإنذار، أو ميعاد التقرير عدّى، أو وحدة متكررة مستنية موافقة)
var ALERT_PREV = null;
setInterval(() => {
  if(!S.me || !S.leadsLoaded) return;
  const mine = l => isAdmin() || l.assignedTo === S.me.uid;
  const now = {late:S.leads.filter(l => mine(l) && isLateFirst(l)).length, rep:reportLate() ? 1 : 0,
    pend:isBoss() ? S.units.filter(u => u.pendingDup).length : 0, soon:S.units.filter(u => isSoon(u) && (isAdmin() ? myUnitsScope(u) : u.agentId === S.me.uid)).length};
  if(ALERT_PREV && S.me.uid === ALERT_PREV.uid){
    if(now.late > ALERT_PREV.late){ toast(`⚠️ عميل عدّى عليه ${hoursTxt(cfg('firstContactHours'))} من غير تواصل`); beep('late'); }
    else if(now.rep > ALERT_PREV.rep){ toast(`📝 عدّى ميعاد التقرير (${RH()}) — ابعته دلوقتي`); beep('late'); }
    else if(now.pend > ALERT_PREV.pend){ toast('⏳ وحدة جديدة مستنية موافقتك (متكررة أو لمالك عنده وحدة تانية)'); beep('info'); }
    else if(now.soon > ALERT_PREV.soon){ toast('🏠 وحدة متأجرة قرب ميعاد فضيانها'); beep('info'); }
  }
  ALERT_PREV = {...now, uid:S.me.uid};
}, 30000);
</script>
</body>
</html>
